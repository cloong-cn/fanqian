# Nginx 站点示例：把 cw.example.com 换成你的域名；证书用 certbot 申请。没用 umami 就把 CSP 里的 umami.example.com 删掉
limit_req_zone $binary_remote_addr zone=cw_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cw_api:10m   rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cw.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cw.example.com;

    ssl_certificate     /etc/letsencrypt/live/cw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cw.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://umami.example.com; connect-src 'self' https://umami.example.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        limit_req zone=cw_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
    }
    location = /api/login {
        limit_req zone=cw_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
    }
    location /api/ {
        limit_req zone=cw_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
    }
    location / {
        proxy_pass http://127.0.0.1:8790;
    }
}
